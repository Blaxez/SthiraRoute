server {
    server_name rohensingh.in www.rohensingh.in;
    client_max_body_size 20m;
    root /var/www/sthiraroute/apps/web/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/rohensingh.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rohensingh.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.rohensingh.in) {
        return 301 https://$host$request_uri;
    }

    if ($host = rohensingh.in) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name rohensingh.in www.rohensingh.in;
    return 404;
}
